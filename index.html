<!DOCTYPE html>
<html>
  <head>
    <title>Hello, World!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="container"><p id="calculoMostrar">Digite</p></div>
    <div class="grid-container" id="grid">
      <!-- Linha 1 -->
      <button class="grid-item" data-row="1" data-col="1" value="7">7</button>
      <button class="grid-item" data-row="1" data-col="2" value="8">8</button>
      <button class="grid-item" data-row="1" data-col="3" value="9">9</button>
      <button class="grid-item" class="simbls" data-row="1" data-col="4" value="+">+</button>
      <button class="grid-item" class="simbls" data-row="1" data-col="5" value="-">-</button>
                                                            
      <!-- Linha 2 -->
      <button class="grid-item" data-row="2" data-col="1" value="4">4</button>
      <button class="grid-item" data-row="2" data-col="2" value="5">5</button>
      <button class="grid-item" data-row="2" data-col="3" value="6">6</button>
      <button class="grid-item" class="simbls" data-row="2" data-col="4" value="/">÷</button>

      <!-- Linha 3 -->
      <button class="grid-item" data-row="3" data-col="1" value="1">1</button>
      <button class="grid-item" data-row="3" data-col="2" value="2">2</button>
      <button class="grid-item" data-row="3" data-col="3" value="3">3</button>
                                                                                                                                            
      <!-- Linha 4 -->
      <button class="grid-item" id="btn0" data-row="4" data-col="1" value="0">0</button>
      <button class="grid-item" data-row="4" data-col="3" value=",">,</button>
    </div>
    <script type="module" src="script.js"></script>
  </body>
</html>
